<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Nino - Un detalle especial</title>
    <style>
        /* Fondo animado y llamativo */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas brillantes flotantes (estilo anime) */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            animation: floatUp infinite linear;
        }

        @keyframes floatUp {
            from { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            to { transform: translateY(-10px) scale(1.5); opacity: 0; }
        }

        /* Tarjeta principal con efecto de cristal (Glassmorphism) */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: fadeInCard 1s ease-out;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Marco circular para la imagen de Nino */
        .avatar-frame {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, #ff4757, #ff6b81, #ffa502);
            box-shadow: 0 0 25px rgba(255, 107, 129, 0.8);
            animation: pulseAvatar 2.5s infinite alternate;
        }

        @keyframes pulseAvatar {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 107, 129, 0.6); }
            100% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 107, 129, 0.9); }
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
        }

        h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(255,255,255,0.8);
        }

        p {
            color: #444;
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Botón interactivo y brillante */
        .btn-gift {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        .btn-gift:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(255, 71, 87, 0.7);
        }

        /* Sección del Ramo Animado */
        #bouquet-section {
            display: none;
            margin-top: 10px;
            animation: popUpBouquet 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUpBouquet {
            0% { opacity: 0; transform: scale(0.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Flores Gigantes */
        .bouquet-icon {
            font-size: 7.5rem; /* Tamaño mucho más grande */
            line-height: 1;
            margin-bottom: 15px;
            animation: floatBouquet 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 15px 25px rgba(255, 215, 0, 0.7));
        }

        @keyframes floatBouquet {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        .bouquet-msg {
            color: #d35400;
            font-size: 1.3rem;
            font-weight: 800;
            margin-top: 15px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.8);
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Generador de partículas de fondo -->
    <div class="particles">
        <div class="particle" style="left: 10%; animation-duration: 6s; width: 8px; height: 8px;"></div>
        <div class="particle" style="left: 30%; animation-duration: 9s; width: 12px; height: 12px;"></div>
        <div class="particle" style="left: 50%; animation-duration: 5s; width: 6px; height: 6px;"></div>
        <div class="particle" style="left: 70%; animation-duration: 8s; width: 15px; height: 15px;"></div>
        <div class="particle" style="left: 90%; animation-duration: 7s; width: 10px; height: 10px;"></div>
    </div>

    <div class="card">
        <!-- Contenedor circular con borde brillante para la imagen -->
        <div class="avatar-frame">
            <!-- Coloca aquí el enlace de tu imagen de Nino -->
            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop" alt="Nino Cosplay">
        </div>

        <h1 id="main-title">Nino 🎀</h1>
        <p id="description-text">Tengo una sorpresa muy especial preparada para ti. Descubre tu detalle.</p>

        <button class="btn-gift" id="revealBtn" onclick="revealSurprise()">Abrir Sorpresa 🌻</button>

        <!-- Ramo de Rosas y Orquídeas Gigante -->
        <div id="bouquet-section">
            <div class="bouquet-icon">💐</div>
            <div class="bouquet-msg">¡Un hermoso ramo de rosas y orquídeas amarillas para ti!</div>
        </div>
    </div>

    <script>
        function revealSurprise() {
            // Ocultar botón y texto
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('description-text').style.display = 'none';
            
            // Mostrar la sección del ramo de flores gigante
            document.getElementById('bouquet-section').style.display = 'block';
            
            // Cambiar el título
            document.getElementById('main-title').innerText = "¡Detalle Especial!";
        }
    </script>
</body>
</html>

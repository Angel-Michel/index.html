<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Nino - Un detalle especial</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: fadeInCard 1s ease-out;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo para mostrar la temática de anime/cosplay */
        .anime-frame {
            width: 100%;
            height: 220px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 2px solid #ff6b81;
            position: relative;
            background: #ff6b81;
        }

        .anime-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: pulseImage 4s ease-in-out infinite alternate;
        }

        @keyframes pulseImage {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        p {
            color: #e0e0e0;
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Botón interactivo */
        .btn-gift {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        .btn-gift:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        /* Sección del Ramo Animado */
        #bouquet-section {
            display: none;
            margin-top: 20px;
            animation: popUpBouquet 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUpBouquet {
            0% { opacity: 0; transform: scale(0.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .bouquet-icon {
            font-size: 4rem;
            animation: floatBouquet 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
        }

        @keyframes floatBouquet {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .bouquet-msg {
            color: #ffd700;
            font-size: 1.15rem;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Contenedor visual del personaje -->
        <div class="anime-frame">
            <!-- Puedes cambiar el enlace de la imagen por la que generamos o una propia -->
            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop" alt="Nino Cosplay">
        </div>

        <h1>Nino 🎀</h1>
        <p id="description-text">Tengo una sorpresa muy especial preparada para ti. Haz clic en el botón para descubrir tu detalle.</p>

        <button class="btn-gift" id="revealBtn" onclick="revealSurprise()">Abrir Sorpresa 🌻</button>

        <!-- Ramo de Rosas y Orquídeas (Aparece al hacer clic) -->
        <div id="bouquet-section">
            <div class="bouquet-icon">💐</div>
            <div class="bouquet-msg">¡Un hermoso ramo de rosas y orquídeas amarillas para ti!</div>
        </div>
    </div>

    <script>
        function revealSurprise() {
            // Ocultar botón y texto descriptivo
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('description-text').style.display = 'none';
            
            // Mostrar la sección del ramo de flores animado
            document.getElementById('bouquet-section').style.display = 'block';
            
            // Cambiar el título superior para darle dinamismo
            document.querySelector('h1').innerText = "¡Detalle Especial!";
        }
    </script>
</body>
</html>
